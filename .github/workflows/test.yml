name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Install the Chromium build that matches the locked playwright-core version.
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - name: Lint the demo figures
        run: |
          node bin/figlint.js docs/demo/fixed.svg
          node bin/figlint.js examples/bar-chart.svg examples/flow.html
          if node bin/figlint.js docs/demo/broken.svg > /dev/null; then echo "broken.svg should fail"; exit 1; fi
