<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs><clipPath id="c"><rect width="300" height="200"/></clipPath></defs>
  <!-- background bigger than the canvas on purpose -->
  <rect x="-10" y="-10" width="320" height="220" fill="#f6f8fa"/>
  <!-- cropped decoration inside a clip-path -->
  <g clip-path="url(#c)"><circle cx="300" cy="0" r="60" fill="#ddf4ff"/></g>
  <rect x="20" y="20" width="80" height="40" fill="#d0d7de" stroke="#444"/>
  <circle cx="200" cy="120" r="30" fill="#d0d7de" stroke="#444"/>
</svg>
