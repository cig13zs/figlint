<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#ffffff"/>
  <!-- centre-to-centre line drawn under the nodes -->
  <line x1="75" y1="115" x2="425" y2="115" stroke="#999" stroke-width="1"/>
  <rect x="20" y="90" width="110" height="50" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="75" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2328">Client</text>
  <rect x="360" y="90" width="130" height="50" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="425" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2328">Server</text>
  <!-- arrow with marker, path ends on the node edge -->
  <path class="edge" d="M75 140 C75 200, 425 200, 425 141" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- arrow ending at a circle -->
  <circle cx="240" cy="40" r="18" fill="#fff8c5" stroke="#9a6700"/>
  <path d="M130 100 L223 47" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- legend swatch next to its label, axis with gridlines and ticks -->
  <line x1="20" y1="270" x2="44" y2="270" stroke="#cf222e" stroke-width="3"/>
  <text x="50" y="275" font-family="sans-serif" font-size="12" fill="#1f2328">errors</text>
  <line x1="300" y1="280" x2="540" y2="280" stroke="#1f2328"/>
  <line x1="300" y1="230" x2="540" y2="230" stroke="#d0d7de"/>
  <line x1="320" y1="280" x2="320" y2="285" stroke="#1f2328"/>
  <line x1="420" y1="280" x2="420" y2="285" stroke="#1f2328"/>
</svg>
